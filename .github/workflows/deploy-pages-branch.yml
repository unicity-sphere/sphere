name: Deploy Branch to GitHub Pages

on:
  push:
    branches-ignore: ['gh-pages']
  delete:  # Triggered when a branch is deleted
  workflow_dispatch:

permissions:
  contents: write  # Needed to push to gh-pages branch

# Per-operation concurrency (sphere#369). Deploys are keyed per-branch
# (`deploy-<branch>`) and delete-cleanups per-deleted-ref (`cleanup-<type>-<ref>`)
# in DISJOINT namespaces, so a branch-deletion cleanup can never share a group
# with — and therefore can never cancel — any branch's deploy.
#
# The old global `gh-pages-deploy` group (with cancel-in-progress: false) put
# the push-deploy and the delete-cleanup in the SAME group. On a squash-merge
# that also deletes the PR branch, both runs become pending together; GitHub
# keeps only the newest pending run per group and cancels the older one, so the
# just-merged deploy was silently cancelled and staging kept the old bundle.
# Note `github.ref` is NOT a fix on its own: on a `delete` event it resolves to
# the default branch (`main`), so it would still collide a deploy of `main` with
# any cleanup. The event-aware prefixed key below is collision-free regardless
# of which branch is the default. (ref_type is folded into the cleanup key so a
# branch and a same-named tag deleted together don't share a cleanup group.)
#
# Trade-off vs. the old design: the global group serialized ALL gh-pages pushes,
# so they never raced. These per-op groups let pushes of DIFFERENT refs overlap,
# and peaceiris pushes non-force with no retry (verified against the action
# source) — so overlapping writers reject each other with a non-fast-forward.
#
# That was originally accepted as "loud and re-runnable", but it is not rare and
# it is not cheap: a squash-merge that also deletes the PR branch fires BOTH a
# push and a delete, so main's deploy races the cleanup on essentially every
# merge. On 2026-08-25 the cleanup won and main's deploy lost (run 32879676902),
# which left Pages serving the previous bundle until someone noticed the red
# tick — a silent-stale outcome differing from #369 mainly in that a tick went
# red somewhere.
#
# So every writer now retries instead: the two peaceiris steps run again on
# rejection (the action re-fetches gh-pages per invocation, so the retry
# fast-forwards) and the cleanup job rebases and retries its own push. The
# writers touch disjoint directories, so a rebase never conflicts. The disjoint
# concurrency groups above stay exactly as #369 left them — serializing the
# groups is what silently cancelled deploys, and that must not come back.
concurrency:
  group: pages-${{ github.event_name == 'delete' && format('cleanup-{0}-{1}', github.event.ref_type, github.event.ref) || format('deploy-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  # Cleanup job - runs when a branch is deleted
  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          # Full history: the push below rebases onto whatever a rival writer
          # landed, and `git pull --rebase` is not reliable on checkout's default
          # depth-1 clone. This job runs only on branch deletion, so the extra
          # fetch is rare.
          fetch-depth: 0

      - name: Get branch name
        id: branch
        run: |
          # Sanitize branch name for use in URL path (replace / with -)
          BRANCH_NAME="${{ github.event.ref }}"
          BRANCH_NAME="${BRANCH_NAME//\//-}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Remove branch directory
        run: |
          if [ -d "${{ steps.branch.outputs.name }}" ]; then
            rm -rf "${{ steps.branch.outputs.name }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove ${{ steps.branch.outputs.name }} (branch deleted)"
            # gh-pages has several unsynchronised writers (this cleanup, the
            # branch deploy, the redirect deploy), so a non-fast-forward here is
            # ordinary, not exceptional. Rebase onto whatever landed and retry;
            # the writers touch disjoint directories, so the rebase is clean.
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              echo "push rejected (attempt $attempt) — rebasing onto the newer gh-pages"
              git pull --rebase origin gh-pages
              sleep $((RANDOM % 5 + 1))
            done
            echo "::error::gh-pages push still rejected after 5 attempts"
            exit 1
          else
            echo "Directory ${{ steps.branch.outputs.name }} does not exist, skipping"
          fi

  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'delete'
    outputs:
      branch_name: ${{ steps.branch.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get branch name
        id: branch
        run: |
          # Sanitize branch name for use in URL path (replace / with -)
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /sphere/${{ steps.branch.outputs.name }}/
          # Public URL — baked into the bundle at build time. Hardcoded
          # because the same value applies to every branch preview deploy.
          VITE_SPHERE_API_URL: https://quest-api.staging.unicity.network
          # wallet-api backend (S4 asset path) — absolute https URL, baked in
          # at build time. The staging backend serves wildcard CORS, so the
          # github.io origin reaches it directly (no dev proxy involved; the
          # SDK derives the wss:// wake socket from this same base). Engine
          # override vars (VITE_AGGREGATOR_URL / VITE_TRUSTBASE_URL) stay
          # UNSET here on purpose: the testnet2 network preset supplies the
          # real gateway + the trustbase it serves — never mix trustbases.
          VITE_WALLET_API_URL: https://wallet-api.staging.unicity.network
          # #351 composition assert: this deploy INTENDS wallet-api custody —
          # if VITE_WALLET_API_URL ever goes missing from a bundle (stale CDN
          # rebuild, env drift), the app fails fast at provider composition
          # instead of silently swapping to the legacy local-custody model
          # (the 2026-06-12 incident).
          VITE_REQUIRE_WALLET_API: 'true'
          # Aggregator API key — inlined into the bundle at build time.
          # The testnet2 value is NOT a secret (see .env / .env.example), so it
          # is safe to hardcode here. Without it the deployed bundle gets
          # undefined and the aggregator rejects mints with "unauthorized".
          # With subscriptions ON (below) this key is only the pre-onboarding
          # fallback — steady-state traffic rides per-wallet SGW keys.
          VITE_AGGREGATOR_API_KEY: sk_ddc3cfcc001e4a28ac3fad7407f99590
          # Subscriptions — mirrors staging (sphere-infra deploy-sphere-site.sh:
          # SUBSCRIPTION_ENABLED=true, PAID_PLANS_ENABLED=false). Staging feeds
          # these through the container runtime config; Pages previews have no
          # container, so they bake the VITE_* fallbacks at build time
          # (src/config/subscription.ts). Without this, previews hide the
          # subscription settings AND funnel every visitor through the one
          # shared static key above — which is what 429s the gateway.
          VITE_SUBSCRIPTION_ENABLED: 'true'
          VITE_PAID_PLANS_ENABLED: 'false'
          # Sentry stays OFF in branch previews: an empty DSN skips init
          # (src/config/sentry.ts). Previews are PROD builds, so without this
          # every branch push would report errors/replays against the shared
          # free-tier quota (5k errors, 50 replays per month).
          VITE_SENTRY_DSN: ''

      - name: Deploy branch to GitHub Pages
        id: publish
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.branch.outputs.name }}
          keep_files: true

      # peaceiris pushes non-force and does not retry, so a rival writer that
      # landed during our ~2-min build rejects this push. It re-fetches gh-pages
      # on every invocation, so simply running it again fast-forwards. Same
      # inputs deliberately: this is a retry, not a fallback with other rules.
      - name: Deploy branch to GitHub Pages (retry after a rival push)
        if: steps.publish.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.branch.outputs.name }}
          keep_files: true

      - name: Output deployment URL
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ steps.branch.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **URL:** https://${{ github.repository_owner }}.github.io/sphere/${{ steps.branch.outputs.name }}/" >> $GITHUB_STEP_SUMMARY

  deploy-redirect:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event_name != 'delete'
    steps:
      - name: Create redirect and SPA 404 pages
        run: |
          mkdir -p redirect
          cat > redirect/index.html << 'REDIRECT_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=/sphere/main/">
            <title>Redirecting...</title>
            <script>window.location.href = '/sphere/main/';</script>
          </head>
          <body>
            <p>Redirecting to <a href="/sphere/main/">/sphere/main/</a>...</p>
          </body>
          </html>
          REDIRECT_EOF

          # Root 404.html — SPA fallback for BrowserRouter branch deployments.
          # Converts /sphere/{branch}/{route}?qs → /sphere/{branch}/?p=/{route}&qs
          # so GitHub Pages serves the branch's index.html; the app's decoder
          # then restores the real path via history.replaceState.
          cat > redirect/404.html << 'SPA_EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"></head>
          <body>
            <script>
              var path = window.location.pathname;
              var m = path.match(/^(\/sphere\/[^/]+)(\/.+)/);
              if (m) {
                var qs = window.location.search;
                window.location.replace(
                  m[1] + '/?p=' + encodeURIComponent(m[2]) +
                  (qs ? '&' + qs.substring(1) : '') +
                  window.location.hash
                );
              }
            </script>
          </body>
          </html>
          SPA_EOF

      - name: Deploy redirect
        id: publish_redirect
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect
          keep_files: true  # Don't delete branch subdirectories

      - name: Deploy redirect (retry after a rival push)
        if: steps.publish_redirect.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect
          keep_files: true  # Don't delete branch subdirectories
