name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` runs `tsc -b`, which covers src/ only — tests/ is a separate
      # project (tsconfig.test.json) that nothing checked, so it drifted: the
      # marketplace hook mocks had been uncompilable for a while and CI stayed
      # green. Types before behaviour, so a broken mock fails here rather than as
      # a confusing runtime assertion.
      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
